name: Build contrib‑rs aarch64‑android cdylib (rust‑1.93.1)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contrib‑rs source
        uses: actions/checkout@v4

      - name: Checkout main meme‑generator‑rs (peer dependency)
        run: |
          git clone https://github.com/MemeCrafters/meme-generator-rs.git ../meme-generator-rs
          cd ../meme-generator-rs
          # ⚠️ 重要：替换为你 Termux 上 meme-generator‑rs 的实际 commit hash
          git checkout main

      - name: Install fixed Rust 1.93.1 toolchain
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: aarch64-linux-android

      - name: Install cross compile tool
        run: cargo install cross

      - name: Cross‑compile cdylib dynamic library
        run: |
          cross build --release --lib --target aarch64-linux-android
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android-clang
          SKIA_STATIC_LINK: "1"

      - name: Upload compiled .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmeme-contrib-aarch64-android-rust1931
          path: target/aarch64-linux-android/release/libmeme_generator_contrib.so
